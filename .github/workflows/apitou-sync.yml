# Sincronização diária do apitou — PLANO B (independente da Vercel).
#
# Por que existe, se já há Vercel Cron:
#  - Não depende do limite de duração da função (o plano Hobby permite 300s e o
#    sync leva ~36s hoje, mas isso pode mudar com mais ligas).
#  - Roda o script completo (scripts/apitou-sync.mjs) na máquina do runner,
#    com memória folgada e sem timeout de plataforma.
#  - Guarda log de cada execução.
#
# Configure em: Settings > Secrets and variables > Actions
#   DATABASE_URL   (obrigatório) connection string do Neon
#   APITOU_SYNC_KEY (opcional)  se quiser também bater na rota da Vercel
#
# O horário é UTC: 06:00 UTC = 03:00 em Brasília (UTC-3).
name: apitou sync

on:
  schedule:
    - cron: "0 6 * * *"
  # Permite disparar à mão pela aba Actions para testar.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas baixar e validar, sem gravar no banco"
        type: boolean
        default: false

# Uma execução por vez: dois syncs simultâneos gravariam o mesmo registro.
concurrency:
  group: apitou-sync
  cancel-in-progress: false

# Necessário para abrir/fechar a issue de alerta em caso de falha.
permissions:
  contents: read
  issues: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Só o necessário para o script: ele importa `pg` e `dotenv`, e compila
      # o fonte.ts com o tsc local.
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Rodar sincronização
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APITOU_SYNC_KEY: ${{ secrets.APITOU_SYNC_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "→ modo dry-run (não grava)"
            node --max-old-space-size=1024 scripts/apitou-sync.mjs --dry-run
          else
            node --max-old-space-size=1024 scripts/apitou-sync.mjs
          fi

      - name: Resumo
        if: always()
        run: |
          echo "### apitou sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- quando: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- modo: ${{ inputs.dry_run == 'true' && 'dry-run' || 'gravação' }}" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Alerta de falha: abre uma issue (ou comenta numa já aberta).
      # Não precisa de SMTP nem de segredo novo — o GitHub manda e-mail para
      # quem segue o repositório. Sem isso, um sync quebrado é invisível: o
      # app continua servindo dados velhos do cache e nada parece errado.
      # ------------------------------------------------------------------
      - name: Abrir issue de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = "apitou sync falhou";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const agora = new Date().toISOString();
            const corpo = [
              `O workflow **${context.workflow}** falhou em ${agora}.`,
              "",
              `- execução (logs): ${runUrl}`,
              "- chave do cache esperada: \`src/lib/apitou/cache-key.json\`",
              "",
              "Enquanto isso não voltar ao verde, `/apitou` depende do sync",
              "preguiçoso (primeira request do dia) e os dados podem estar",
              "parados. Cheque primeiro se o site de origem AINDA serve",
              "`/dados.js` com os mesmos headers (`src/lib/apitou/fonte.ts`).",
              "",
              "<sub>Issue automática do workflow `apitou-sync`. Ela fecha sozinha",
              "quando o sync passar.</sub>",
            ].join("\n");

            const abertas = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existente = abertas.data.find((i) => i.title.startsWith(titulo));

            if (existente) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existente.number,
                body: `Falhou de novo em ${agora}.\n\n${corpo}`,
              });
              core.notice(`Comentado na issue #${existente.number}`);
            } else {
              const nova = await github.rest.issues.create({
                ...context.repo,
                title: `${titulo} (${agora.slice(0, 10)})`,
                body: corpo,
              });
              core.notice(`Issue aberta: #${nova.data.number}`);
            }

      # Recuperação: fecha as issues de alerta quando o sync volta a passar.
      - name: Fechar issues de alerta
        if: success() && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = "apitou sync falhou";
            const abertas = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            for (const i of abertas.data.filter((x) => x.title.startsWith(titulo))) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: i.number,
                body: "Sync voltou ao normal — fechando automaticamente.",
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: i.number,
                state: "closed",
              });
            }
