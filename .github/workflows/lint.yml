# Lint + checagem de tipos — roda SÓ no GitHub Actions.
#
# Por que não localmente: o projeto é desenvolvido num celular (Termux/arm64).
# Um `eslint .` local no repositório inteiro passou de 18 minutos e travou a
# sessão; o mesmo comando roda em ~1 minuto num runner linux x64, com cache do
# npm entre execuções. Também é o único lugar onde o lint roda hoje: nenhum
# outro workflow chama o ESLint.
#
# Dois jobs, independentes de propósito — se o lint reclamar de um arquivo e o
# tsc estiver limpo, você vê qual dos dois quebrou sem esperar o outro:
#
#   lint       -> npx eslint .   (flat config em eslint.config.mjs)
#   typecheck  -> npx tsc --noEmit
#
# O `eslint.config.mjs` ignora os dumps de recon (`replica`, `apk_extracted`,
# `reverse_engineering`, `.tmp`) e os artefatos (`.next`, `build`,
# `drizzle/meta`): são centenas de MB que não são o app.
#
# Sem segredos: nenhum dos dois jobs abre conexão com banco, então não há
# DATABASE_URL aqui. Se um dia um passo passar a importar `src/db/index.ts` em
# runtime, ponha um valor dummy como no e2e.yml.

name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo ref cancela a rodada anterior: lint velho não interessa.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O relatório JSON vira anotação via scripts/eslint-annotate.mjs: as
      # anotações do check run são legíveis publicamente, o log do job não.
      #
      # Por que não é mais um one-liner com `|| true`: com o `|| true` um erro
      # FATAL do ESLint (exit 2: config, plugin, crash) passava como "step ok"
      # e só sobrava a mensagem "relatório ausente" na etapa seguinte — foi o
      # que escondeu por 4 rodadas o `react-hooks/set-state-in-effect` sem
      # plugin. Agora o exit code é explícito, o stderr vira anotação (logs de
      # job não são públicos) e a ausência do relatório falha aqui.
      #
      # Contrato de saída:
      #   0 -> relatório escrito, sem erros
      #   1 -> relatório escrito, com erros de lint (as anotações dizem quais)
      #   2 -> fatal: nada foi lintado (falha neste step, com o stderr anotado)
      - name: ESLint (relatório JSON)
        run: |
          set +e
          npx eslint . --format json --output-file eslint-report.json \
            > eslint-stdout.log 2> eslint-stderr.log
          status=$?
          set -e
          echo "ESLint exit: $status"

          anota() {
            # % , CR e LF são reservados nos comandos de workflow do Actions.
            tr '\r\n' '  ' < eslint-stderr.log | tail -c 1200 | sed 's/%/%25/g'
          }

          if [ ! -s eslint-report.json ]; then
            echo "::error title=ESLint não lintou nada (exit $status)::$(anota)"
            {
              echo "### ESLint não gerou o relatório (exit $status)"
              echo '```'
              tail -c 3000 eslint-stderr.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error title=ESLint exit inesperado ($status)::$(anota)"
            exit 1
          fi

      - name: Publicar as anotações do ESLint
        run: node scripts/eslint-annotate.mjs eslint-report.json

      # Quando o step acima quebra, o relatório e o stderr são a evidência.
      - name: Guardar relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            eslint-report.json
            eslint-stdout.log
            eslint-stderr.log
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos do app
        run: npx tsc --noEmit
